# 0 - 4 tiers, can be empty
# tier = ["systems", "application", "scripting", "web"]

# 0 - 4 paradigms, can be empty
# paradigms = ["imperative", "oop", "functional", "concurrent", "logic", "declarative"]

# only 1 type, cannot be empty
# type = "programming"
# supported types:
# programming, assembly, text, markup, query, stylesheet, config, shell, template, build, dsl

# atmost one family, can be empty
